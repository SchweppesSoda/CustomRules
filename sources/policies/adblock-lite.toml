# AdBlockLite follows HaGeZi Multi Light (sources/upstreams.toml).
# HTTPDNS exact/suffix rules are protected dynamically on every build.
# Remove overlapping blockers, including broader parent suffixes; do not
# silently turn a suffix into an exact rule or otherwise narrow its semantics.
# Preserve shared push/APIs and error reporters even if upstream changes.
protected_suffixes = [
  "onesignal.com",
  "graph.instagram.com", "graph.whatsapp.com", "graph.whatsapp.net",
  "sentry.io", "sentry.dev", "sentry-cdn.com", "getsentry.com",
  "bugsnag.com", "crashlytics.com", "instabug.com",
]
