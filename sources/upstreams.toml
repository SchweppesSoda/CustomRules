[v2fly]
base_url = "https://raw.githubusercontent.com/v2fly/domain-list-community/master/data"

# HaGeZi's low-interference tier; compatibility exclusions are applied after
# HTTPDNS has been built. Wildcards include both the root and all subdomains.
[sets."AdBlockLite"]
behavior = "domain"
parser = "wildcard-domain-list"
urls = ["https://raw.githubusercontent.com/hagezi/dns-blocklists/main/wildcard/light.txt"]

[crypto_candidates]
url = "https://raw.githubusercontent.com/v2fly/domain-list-community/master/data/category-cryptocurrency"

[sets.AI]
behavior = "domain"
parser = "meta-list"
urls = [
  "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/category-ai-!cn.list",
  "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/apple-intelligence.list",
]

