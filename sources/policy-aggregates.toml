# Aggregate only adjacent rules with the same final policy.
# Keep the two existing client source families distinct; do not broaden either.
schema = 1

[aggregates."Policy/AsianTV"]
policy = "Asian TV"
clients = ["Mihomo", "Stash"]
members = ["AbemaTV", "Bahamut", "Hulu", "Japonx", "KKBOX", "KKTV", "Line", "myTVSUPER", "Niconico", "ViuTV"]

[aggregates."Policy/GlobalTV"]
policy = "Global TV"
clients = ["Mihomo", "Stash"]
members = ["ABC", "PrimeVideo", "BBC", "DAZN", "DiscoveryPlus", "TVB", "Fox", "HBO", "PBS", "Pornhub", "Soundcloud"]

[aggregates."Policy/CNMainlandTV"]
policy = "CN Mainland TV"
clients = ["Mihomo", "Stash"]
members = ["BiliBili", "iQIYI", "Classical/NetEaseMusicYaml", "Classical/TencentVideoYaml", "Classical/WeTV", "Youku"]

[aggregates."Policy/Steam"]
policy = "Steam"
clients = ["Mihomo", "Stash"]
members = ["GameDownload", "Steam"]

[aggregates."Policy/Classical/AppleTV"]
