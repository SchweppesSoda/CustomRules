name: Sync icon library

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'
  push:
    branches: [master]
    paths: [Icons/sources.json, Icons/scripts/**, Icons/tests/**, Icons/requirements.txt, Icons/curated.json, Icons/icons/**, .github/workflows/sync-icons.yml]
  pull_request:
    paths: [Icons/**, .github/workflows/sync-icons.yml]

permissions:
  contents: read

concurrency:
  group: customrules-icons-${{ github.event_name == 'pull_request' && github.ref || 'publish' }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: Icons/requirements.txt
      - run: python -m pip install -r Icons/requirements.txt
      - run: python -m unittest discover -s Icons/tests -v
      - run: python Icons/scripts/sync_icons.py check

  sync:
    if: github.event_name != 'pull_request'
    needs: check
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          ref: master
          fetch-depth: 0
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: Icons/requirements.txt
      - run: python -m pip install -r Icons/requirements.txt
      - id: mirror
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python Icons/scripts/sync_icons.py sync --report Icons/sync-report.json
      - run: python Icons/scripts/sync_icons.py check
      - name: Publish valid updates and retained snapshots
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Icons/library Icons/collections Icons/manifest.json Icons/aliases.json
          if ! git diff --cached --quiet; then
            git commit -m 'sync: update mirrored icon packages'
            git push origin HEAD:master
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: icon-synchronization-report
          path: Icons/sync-report.json
      - name: Report upstream failures
        if: steps.mirror.outcome != 'success'
        run: |
          echo 'Some upstream assets failed; existing good assets were retained. See icon-synchronization-report.'
          exit 1
