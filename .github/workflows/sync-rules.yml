name: Sync Rules

on:
  push:
    paths:
      - 'Mihomo/**/*.yaml'
      - 'scripts/sync_upstream_rules.py'
      - '.github/workflows/sync-rules.yml'
  schedule:
    - cron: '17 20 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Sync upstream service rules
        run: python scripts/sync_upstream_rules.py

      - name: Convert all YAML to List
        run: |
          # 删除 Mihomo 中已不存在对应 yaml 的 list 文件
          for list in Surge/*.list; do
            [ -f "$list" ] || continue
            filename=$(basename "${list%.list}")
            [ -f "Mihomo/${filename}.yaml" ] || rm "$list"
          done

          # 转换所有 yaml 到 list
          for yaml in Mihomo/*.yaml; do
            [ -f "$yaml" ] || continue
            filename=$(basename "${yaml%.yaml}")
            sed -n '/^payload:/,$ {
              /^payload:/d
              s/^  - //
              s/^  # - /# /
              /^  #/s/^  //
              p
            }' "$yaml" > "Surge/${filename}.list"
          done

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Mihomo/ Surge/
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: sync generated rules"
          git push
