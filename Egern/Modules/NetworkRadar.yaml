name: 网络诊断雷达
description: 本地网络、IPv4 出口 / ASN / IPPure 评分及影视 / AI 探测。全部字段单行省略，放大标题，正文分配剩余高度，服务区紧凑显示；“立即检测”绕过缓存。服务页面与地区信息分开显示，不等于解锁。
author: SchweppesSoda
homepage: https://github.com/SchweppesSoda/CustomRules
icon: waveform.path.ecg

env_schema:
  RADAR_LAYOUT:
    name: 显示布局
    description: auto 自动识别小组件尺寸；large 强制大号布局；medium 强制中号布局。
    default_value: auto
    options:
      - auto
      - large
      - medium
  RADAR_POLICY:
    name: 出口检测策略
    description: 填写配置中实际存在的策略名。出口信息、代理延迟和全部服务探测均走此策略；本地公网与延迟固定 DIRECT。
    default_value: Proxy
  RADAR_MASK_IP:
    name: IP 地址打码
    description: 对组件里的公网、内网及网关地址打码；本机检测与缓存仍使用完整地址。
    default_value: "false"
    options: ["false", "true"]
  RADAR_SERVICES_ENABLED:
    name: 影视与 AI 探测
    description: 关闭时仅获取网络与出口信息，服务显示 —。勾表示页面可达，紫色地区码仅为地区信息；失败显示验证、连接、限流等原因。
    default_value: "true"
    options: ["true", "false"]
  RADAR_LOCAL_CACHE_SECONDS:
    name: 本地信息缓存（秒）
    description: 0..600，默认 60。网络变化后失效；出口 IP 每次重新确认，不受此缓存影响。
    default_value: "60"
  RADAR_SERVICE_CACHE_SECONDS:
    name: 服务结果缓存（秒）
    description: 0..3600，默认 600。网络、策略或出口 IP 变化后失效；未知结果最多缓存 30 秒。“立即检测”跳过缓存。
    default_value: "600"

scriptings:
  - generic:
      name: 网络诊断雷达
      script_url: https://raw.githubusercontent.com/SchweppesSoda/CustomRules/refs/heads/master/Egern/Modules/NetworkRadar.js?v=20260909-radar-v2.6
      update_interval: 300
      timeout: 30
  - generic:
      name: 网络诊断雷达 · 立即检测
      script_url: https://raw.githubusercontent.com/SchweppesSoda/CustomRules/refs/heads/master/Egern/Modules/NetworkRadar.js?v=20260909-radar-v2.6
      update_interval: 300
      timeout: 30

widgets:
  - name: 网络诊断雷达
    script_name: 网络诊断雷达
